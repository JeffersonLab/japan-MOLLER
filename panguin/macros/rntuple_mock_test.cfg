# panguin test configuration: TTree-style draw commands on JAPAN mock data
# (run 4, isu_sample_4.root) written as RNTuples.  See
# panguin/RNTUPLE_MOCK_TEST.md for how to produce the file.  Run panguin from
# the panguin directory; to draw the same plots from a TTree file, change the
# rootfile line.
rootfile ../rootfiles/rntuple/isu_sample_4.root
plotFormat pdf

definecut goodcut (ErrorFlag==0&&Entry$>10)
definecut evcut ((Entries$-Entry$)<100&&Entry$>10)

newpage 2 3
	title 1D basics (mul)
	asym_bcm1h02a
	asym_bcm1h02a ErrorFlag==0
	yield_bcm1h02a ErrorFlag==0&&yield_bcm1h02a.Device_Error_Code==0
	1e6*asym_bcm1h02a goodcut
	asym_bcm1h02a-asym_bcm1h02b ErrorFlag==0
	yield_bcm1h02a.num_samples -tree mul

newpage 2 3
	title 2D draw types (mul)
	yield_bcm1h02a:Entry$ ErrorFlag==0 -type . -tree mul
	yield_bcm1h02a:pattern_number goodcut -type box
	asym_bcm1h02a:yield_bcm1h02a ErrorFlag==0 -type prof
	asym_bcm1h02a:asym_bcm1h02b ErrorFlag==0 -type colz
	yield_bcm1h02a:Entry$ evcut
	yield_bcm1h02a:Entry$ ErrorFlag==0 -type l

newpage 2 4
	title Raw channels (evt)
	bcm1h02a:CodaEventNumber -type scat
	bcm1h02a.hw_sum_raw ErrorFlag==0 -tree evt
	bcm1h02a.block0-bcm1h02a.block1 -tree evt
	(1-bcm1h02a/bcm1h02b):(CodaEventNumber) ErrorFlag==0 -tree evt
	bpm1c10XP.SumSq_0 -tree evt
	bpm1c10XP.RawMax_0-bpm1c10XP.RawMin_0 -tree evt
	abs(bpm1c10X)*1e3 ErrorFlag==0 -tree evt
	sqrt(bcm1h02a.block0*bcm1h02a.block1) -tree evt

newpage 2 4
	title Pairs, correlator, functions
	asym_bcm1h02a -tree pr
	yield_bcm1h02a -tree pr
	A -tree lrb_std
	n -tree lrb_std
	TMath::Abs(asym_bcm1h02a)*1e6 ErrorFlag==0
	asym_bcm1h02a:yield_bcm1h02a -tree pr -type prof
	(actual_helicity*2-1)*(asym_bcm1h02a*yield_bcm1h02a)/ppm ErrorFlag==0 -tree pr

newpage 2 3
	title Units and integer-valued variables
	asym_bcm1h02a/ppm ErrorFlag==0
	diff_bpm1c10X/um ErrorFlag==0
	yield_bcm1h02a.Device_Error_Code -tree mul
	BurstCounter -tree mul
	pattern_number -tree mul
	ErrorFlag -tree mul

newpage 1 2
	title Expected failures
	no_such_channel
	yield_bcm1h02a no_such_cut==0
